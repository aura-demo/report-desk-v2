const LS_KEY="rdk2_pw";
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function tryOpen(pw, silent){
  try{
    const data=b64(PAYLOAD), salt=data.slice(0,16), iv=data.slice(16,28), ct=data.slice(28);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    localStorage.setItem(LS_KEY,pw);
    document.open();document.write(new TextDecoder().decode(pt));document.close();
    return true;
  }catch(e){
    if(!silent)document.getElementById('err').textContent='パスワードが違います';
    return false;
  }
}
function go(){tryOpen(document.getElementById('pw').value,false)}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
(async()=>{const s=localStorage.getItem(LS_KEY);if(s)await tryOpen(s,true)})();
</script></body></html>
